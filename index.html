<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Музыка">
<meta name="theme-color" content="#0d0d10">
<link rel="manifest" href="manifest.webmanifest">
<title>Музыка</title>
<style>
@property --tint{syntax:'<color>';inherits:true;initial-value:#fa2d48}
@property --ptint{syntax:'<color>';inherits:true;initial-value:#fa2d48}
:root{
  --bg:#0d0d10;--side:color-mix(in srgb,var(--ptint) 30%,rgba(12,12,16,.5));--line:rgba(255,255,255,.08);--text:#f5f5f7;--muted:#9b9ba6;
  --accent:#fa2d48;--hover:rgba(255,255,255,.07);--hover2:rgba(255,255,255,.12);--glass:color-mix(in srgb,var(--ptint) 26%,rgba(20,20,26,.55));--card:#1b1b21;
  --tint:#fa2d48;--ptint:#fa2d48;transition:--tint 1.2s ease,--ptint 1.2s ease;color-scheme:dark;--amb:.55
}
@media (prefers-color-scheme:light){:root{
  --bg:#f4f4f7;--side:color-mix(in srgb,var(--ptint) 24%,rgba(246,246,250,.6));--amb:.4;--line:rgba(0,0,0,.08);--text:#1d1d1f;--muted:#6e6e78;
  --hover:rgba(0,0,0,.05);--hover2:rgba(0,0,0,.09);--glass:color-mix(in srgb,var(--ptint) 20%,rgba(255,255,255,.62));--card:#fff;color-scheme:light
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(900px 520px at 78% -8%,color-mix(in srgb,var(--tint) 30%,transparent),transparent 70%),
             radial-gradient(700px 480px at 10% 110%,color-mix(in srgb,var(--tint) 16%,transparent),transparent 70%)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
svg{width:22px;height:22px;fill:currentColor;flex:none;display:block}
svg.s{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sprite{position:absolute;width:0;height:0;overflow:hidden}

#app{position:relative;z-index:1;display:grid;grid-template-columns:248px 1fr;height:100%}

/* ---------- sidebar ---------- */
#side{display:flex;flex-direction:column;gap:18px;padding:22px 14px 120px;background:var(--side);backdrop-filter:blur(40px) saturate(1.6);-webkit-backdrop-filter:blur(40px) saturate(1.6);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;font-size:19px;font-weight:700;letter-spacing:-.02em}
.brand .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(145deg,#ff5e7a,#fa2d48 60%,#c9163a);display:grid;place-items:center;color:#fff;box-shadow:0 4px 14px rgba(250,45,72,.45)}
.brand .logo svg{width:17px;height:17px}
.search{position:relative}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted);transition:color .2s}
.search input{width:100%;font:inherit;color:var(--text);background:var(--hover);border:1px solid transparent;border-radius:10px;padding:9px 12px 9px 34px;outline:none;transition:background .2s,border-color .2s,box-shadow .2s}
.search input::placeholder{color:var(--muted)}
.search input:focus{background:var(--hover2);border-color:color-mix(in srgb,var(--accent) 60%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.search:focus-within svg{color:var(--accent)}
.lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 10px;margin-bottom:-8px}
nav{display:flex;flex-direction:column;gap:2px}
.nav{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:9px;font-size:15px;font-weight:500;text-align:left;transition:background .2s,transform .15s;position:relative}
.nav svg{width:20px;height:20px;color:var(--accent);transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.nav:hover{background:var(--hover)}
.nav:hover svg{transform:scale(1.18) rotate(-6deg)}
.nav:active{transform:scale(.97)}
.nav.active{background:var(--hover2);font-weight:600}
.nav .cnt{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.sidefoot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.addbtn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--hover);font-weight:600;transition:background .2s,transform .15s}
.addbtn svg{width:18px;height:18px;color:var(--accent);flex:none}
.addbtn:hover{background:var(--hover2)}
.addbtn:active{transform:scale(.97)}
.addbtn.primary{background:var(--accent);color:#fff;box-shadow:0 6px 18px rgba(250,45,72,.35)}
.addbtn.primary svg{color:#fff}
.addbtn.primary:hover{filter:brightness(1.08)}
.stat{padding:4px 10px;color:var(--muted);font-size:12px}

/* ---------- main ---------- */
#main{overflow:auto;padding:30px 36px 140px;scroll-behavior:smooth}
#main::-webkit-scrollbar{width:12px}
#main::-webkit-scrollbar-thumb{background:var(--hover2);border-radius:8px;border:3px solid transparent;background-clip:padding-box}
.enter>*{animation:fadeUp .5s cubic-bezier(.2,.8,.2,1) both}
.enter>*:nth-child(2){animation-delay:.05s}
.enter>*:nth-child(3){animation-delay:.1s}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.phead{display:flex;align-items:flex-end;gap:16px;margin-bottom:18px}
.phead h1{margin:0;font-size:32px;letter-spacing:-.03em;font-weight:800}
.psub{color:var(--muted);margin-top:4px}
.phead .grow{flex:1}
.pill{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;background:var(--hover);font-weight:600;transition:background .2s,transform .15s}
.pill svg{width:16px;height:16px}
.pill:hover{background:var(--hover2)}
.pill:active{transform:scale(.95)}
.pill.accent{background:var(--accent);color:#fff;box-shadow:0 6px 18px rgba(250,45,72,.35)}
.pill.accent:hover{filter:brightness(1.1)}
select.pill{appearance:none;-webkit-appearance:none;padding-right:16px;outline:none;color:var(--text)}
select.pill option{color:#111}

/* rows */
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:48px minmax(0,2fr) minmax(0,1.2fr) 34px 52px 34px 34px;gap:14px;align-items:center;padding:6px 10px;border-radius:10px;transition:background .15s;position:relative}
.row:nth-child(even){background:color-mix(in srgb,var(--hover) 55%,transparent)}
.row:hover{background:var(--hover2)}
.row.cur .t{color:var(--accent)}
.rc{position:relative;width:48px;height:48px;border-radius:7px;overflow:hidden;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.rc .cover{width:100%;height:100%}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;opacity:0;transition:opacity .18s;color:#fff;backdrop-filter:blur(2px)}
.ov svg{width:20px;height:20px;transform:scale(.7);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.row:hover .ov{opacity:1}.row:hover .ov svg{transform:scale(1)}
.row.cur .ov{opacity:1}
.row.cur .ov .pi{display:none}
.row.cur:hover .ov .pi{display:block}.row.cur:hover .ov .eq{display:none}
.t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dur{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.heart,.del{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;color:var(--muted);transition:background .15s,color .15s,opacity .15s,transform .15s}
.heart svg,.del svg{width:18px;height:18px}
.heart{opacity:0}.row:hover .heart,.heart.on{opacity:1}
.del{opacity:0}.row:hover .del{opacity:1}
.heart:hover,.del:hover{background:var(--hover2);color:var(--text)}
.del:hover{color:#ff5c6c}
.heart svg{fill:none;stroke:currentColor}
.heart.on{color:var(--accent)}
.heart.on svg{fill:var(--accent);stroke:var(--accent)}
.heart svg,.heartb svg{overflow:visible}
.eq{display:flex;gap:2.5px;align-items:flex-end;height:16px}
.eq i{display:block;width:3px;height:100%;background:#fff;border-radius:2px;transform-origin:bottom;animation:eq .9s ease-in-out infinite alternate}
.eq i:nth-child(1){animation-duration:.7s}.eq i:nth-child(2){animation-duration:1s;animation-delay:-.3s}
.eq i:nth-child(3){animation-duration:.8s;animation-delay:-.5s}.eq i:nth-child(4){animation-duration:1.1s;animation-delay:-.2s}
@keyframes eq{0%{transform:scaleY(.2)}100%{transform:scaleY(1)}}
body:not(.playing) .eq i{animation-play-state:paused}

.cover{background-size:cover;background-position:center;display:grid;place-items:center;color:rgba(255,255,255,.85);position:relative}
.cover .ph{width:42%;height:42%;stroke-width:1.7;filter:drop-shadow(0 2px 6px rgba(0,0,0,.25))}

/* grid cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:26px 22px}
.card{cursor:pointer;animation:fadeUp .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(min(var(--i,0),18) * 28ms);transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.card:hover{transform:translateY(-4px)}
.card:active{transform:scale(.97)}
.cc{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;box-shadow:0 10px 28px rgba(0,0,0,.35);transition:box-shadow .25s}
.card:hover .cc{box-shadow:0 18px 40px rgba(0,0,0,.5)}
.cc .cover{width:100%;height:100%;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.card:hover .cc .cover{transform:scale(1.06)}
.card.art .cc{border-radius:50%}
.cplay{position:absolute;left:10px;bottom:10px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.85);color:#111;display:grid;place-items:center;opacity:0;transform:translateY(8px) scale(.8);transition:opacity .2s,transform .3s cubic-bezier(.3,1.6,.5,1);backdrop-filter:blur(10px)}
.card.art .cplay{left:50%;bottom:50%;margin:0 0 -20px -20px}
.cplay svg{width:18px;height:18px;margin-left:2px}
.card:hover .cplay{opacity:1;transform:none}
/* наклон + свет, как у карточек Apple TV */
.tilt{position:relative;--rx:0deg;--ry:0deg;--mx:50%;--my:50%;transform:perspective(720px) rotateX(var(--rx)) rotateY(var(--ry));transition:transform .55s cubic-bezier(.2,.8,.2,1);will-change:transform}
.tilt.live{transition:transform .12s linear}
.tilt .cc{z-index:1;isolation:isolate;transform:translateZ(0);-webkit-mask-image:-webkit-radial-gradient(white,black);backface-visibility:hidden}
.tilt .cc .cover{border-radius:inherit}
.tilt .glow{position:absolute;z-index:0;left:7%;right:7%;top:14%;bottom:-12%;border-radius:14px;background-size:cover;background-position:center;filter:blur(20px) saturate(1.7) brightness(1.1);opacity:0;transform:translate(calc((var(--ry) / 9) * -10px),calc(10px + (var(--rx) / 9) * 8px)) scale(.94);transition:opacity .45s,transform .45s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.tilt .glow .ph{display:none}
.card.art .tilt .glow{border-radius:50%}
.card:hover .tilt .glow{opacity:.8;transform:translate(calc((var(--ry) / 9) * -10px),calc(14px + (var(--rx) / 9) * 8px)) scale(1)}
.tilt .cc::after{content:"";position:absolute;inset:0;z-index:1;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(circle at var(--mx) var(--my),rgba(255,255,255,.34),rgba(255,255,255,.08) 38%,transparent 62%);mix-blend-mode:soft-light}
.card:hover .tilt .cc::after{opacity:1}
.tilt .cplay{z-index:2}
@media (hover:none),(prefers-reduced-motion:reduce){.tilt{transform:none!important}.tilt .cc::after{display:none}}
.cplay:hover{background:#fff;transform:scale(1.1)!important}
.cc .t{margin-top:10px}
.card .t{margin-top:10px}
.card.art .t,.card.art .sub{text-align:center}

/* detail */
.back{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-weight:600;margin-bottom:16px;transition:transform .2s}
.back svg{width:18px;height:18px;transition:transform .2s}
.back:hover svg{transform:translateX(-4px)}
.dhead{display:flex;gap:26px;align-items:flex-end;margin-bottom:26px}
.dhead .cover{width:210px;height:210px;border-radius:14px;box-shadow:0 18px 44px rgba(0,0,0,.45);flex:none}
.dhead.art .cover{border-radius:50%}
.dhead .kind{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--accent)}
.dhead h1{margin:4px 0 6px;font-size:38px;letter-spacing:-.03em;font-weight:800;line-height:1.05}
.dbtns{display:flex;gap:10px;margin-top:16px}

/* empty */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:12vh 20px 0;color:var(--muted)}
.empty .big{width:112px;height:112px;border-radius:30px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,#ff5e7a,#fa2d48 60%,#b5123a);box-shadow:0 20px 50px rgba(250,45,72,.4);animation:float 4s ease-in-out infinite}
.empty .big svg{width:54px;height:54px}
@keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-12px) rotate(3deg)}}
.empty h2{margin:6px 0 0;color:var(--text);font-size:24px;letter-spacing:-.02em}
.empty p{margin:0;max-width:380px}
.empty .dbtns{margin-top:8px}

/* ---------- bottom bar ---------- */
#bar{position:fixed;left:264px;right:16px;bottom:16px;z-index:20;height:80px;display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,560px) minmax(0,1fr);gap:16px;align-items:center;padding:0 18px;border-radius:22px;
  background:var(--glass);backdrop-filter:blur(40px) saturate(1.8);-webkit-backdrop-filter:blur(40px) saturate(1.8);border:1px solid var(--line);box-shadow:0 18px 50px rgba(0,0,0,.4)}
.bl{display:flex;align-items:center;gap:13px;min-width:0;cursor:pointer}
.bl .cover{width:54px;height:54px;border-radius:9px;flex:none;box-shadow:0 4px 14px rgba(0,0,0,.4);transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.bl:hover .cover{transform:scale(1.06)}
.bl .meta{min-width:0}
.bm{display:flex;flex-direction:column;gap:7px;align-items:center}
.ctrls{display:flex;align-items:center;gap:8px}
.ib{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--text);opacity:.82;transition:background .15s,opacity .15s,transform .15s,color .15s}
.ib svg{width:20px;height:20px}
.ib:hover{background:var(--hover2);opacity:1}
.ib:active{transform:scale(.86)}
.ib.on{color:var(--accent);opacity:1}
.ib.on::after{content:"";position:absolute;margin-top:30px;width:4px;height:4px;border-radius:50%;background:var(--accent)}
.ib{position:relative}
.ib.sm svg{width:18px;height:18px}
.pp{width:46px;height:46px;border-radius:50%;background:var(--text);color:var(--bg);display:grid;place-items:center;position:relative;transition:transform .2s cubic-bezier(.3,1.6,.5,1),box-shadow .2s;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.pp:hover{transform:scale(1.08)}.pp:active{transform:scale(.92)}
.pp svg{position:absolute;width:22px;height:22px;fill:currentColor;stroke:currentColor;stroke-width:2.4;stroke-linejoin:round;overflow:visible;will-change:transform;transform:translateZ(0);contain:layout style}
.seek{display:flex;align-items:center;gap:10px;width:100%;color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
.seek span{min-width:34px}.seek span:last-child{text-align:right}
.rng{-webkit-appearance:none;appearance:none;flex:1;height:4px;border-radius:3px;outline:none;cursor:pointer;margin:0;
  background:linear-gradient(to right,var(--fill,var(--text)) var(--p,0%),rgba(128,128,128,.32) var(--p,0%));transition:height .15s}
.rng:hover{height:7px}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:0;height:0;border-radius:50%;background:var(--fill,var(--text));transition:width .15s,height .15s}
.rng:hover::-webkit-slider-thumb{width:13px;height:13px;box-shadow:0 1px 5px rgba(0,0,0,.4)}
.br{display:flex;align-items:center;justify-content:flex-end;gap:6px}
.br .rng{flex:none;width:96px}
.br .ib.heartb svg{fill:none;stroke:currentColor}
.br .ib.heartb.on svg,.f .heartb.on svg{fill:var(--accent);stroke:var(--accent)}

/* ---------- fullscreen ---------- */
#full{position:fixed;inset:0;z-index:50;color:#fff;overflow:hidden;background:#0b0b0e;transform:translateY(102%);transition:transform .6s cubic-bezier(.2,.9,.2,1);visibility:hidden}
#full.open{transform:none;visibility:visible}
.flyg{position:fixed!important;z-index:70;margin:0;pointer-events:none;overflow:hidden;transform:none!important;transition:none!important;will-change:left,top,width,height}
.fbg{position:absolute;inset:-12%;background-size:cover;background-position:center;filter:blur(70px) saturate(1.9) brightness(.8);opacity:0;transition:opacity 1.2s;animation:drift 26s ease-in-out infinite alternate}
.fbg.on{opacity:1}
@keyframes drift{from{transform:scale(1.05) translate(-2%,-1%) rotate(0)}to{transform:scale(1.25) translate(2%,2%) rotate(6deg)}}
.fshade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.25),rgba(0,0,0,.45))}
#parts{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
#viz{position:absolute;left:0;right:0;bottom:0;width:100%;height:30%;pointer-events:none;mask-image:linear-gradient(to top,#000 30%,transparent);-webkit-mask-image:linear-gradient(to top,#000 30%,transparent)}
.fclose{position:absolute;top:22px;left:24px;z-index:3}
.fclose.ib{color:#fff;background:rgba(255,255,255,.14);backdrop-filter:blur(16px);width:42px;height:42px}
.fwrap{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:40px 24px 90px}
.fcw{width:min(44vh,380px);aspect-ratio:1;transform:scale(.84);transition:transform .7s cubic-bezier(.3,1.4,.5,1),width .4s}
.f.info{transition:margin .4s}
body.playing .fcw{transform:scale(1)}
.fcin{width:100%;height:100%;transform:scale(var(--beat,1));will-change:transform}
.bglow{position:absolute;inset:-4%;z-index:-1;border-radius:26px;background:var(--vc,#fa2d48);filter:blur(38px) saturate(1.3);opacity:var(--bgo,0);transform:scale(var(--bgs,1));pointer-events:none;will-change:opacity,transform}
#full.pure .bglow{border-radius:32px;filter:blur(60px) saturate(1.3)}
.fcin .cover{width:100%;height:100%;border-radius:18px;box-shadow:0 40px 100px rgba(0,0,0,.55)}
.f.info{width:min(520px,86vw);display:flex;align-items:center;gap:12px}
.f.info .meta{flex:1;min-width:0}
.ft{font-size:24px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fa{font-size:17px;color:rgba(255,255,255,.65);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f .ib{color:#fff}
.f .seek{width:min(520px,86vw);color:rgba(255,255,255,.65)}
.f .rng{--fill:#fff}
.f .ctrls{gap:18px}
.f .ib svg{width:26px;height:26px}
.f .ib.sm svg{width:20px;height:20px}
.f .pp{width:68px;height:68px;background:#fff;color:#111}
.f .pp svg{width:30px;height:30px}
.f .vol{display:flex;align-items:center;gap:10px;width:min(300px,70vw)}
.f .vol .ib{width:30px;height:30px}.f .vol .ib svg{width:18px;height:18px}
.f .vol .rng{height:4px}


/* ---------- стеклянные панели: размытая обложка за окном + подкраска под трек ---------- */
#amb{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#amb i{position:absolute;inset:-18%;background-size:cover;background-position:center;opacity:0;filter:blur(90px) saturate(2) brightness(.9);transition:opacity 1.4s ease;animation:drift 30s ease-in-out infinite alternate}
#amb i.on{opacity:var(--amb,.55)}
#side{backdrop-filter:blur(44px) saturate(1.9);-webkit-backdrop-filter:blur(44px) saturate(1.9);border-right:1px solid rgba(255,255,255,.1);box-shadow:inset -1px 0 0 rgba(255,255,255,.05),12px 0 40px rgba(0,0,0,.16)}
#bar{backdrop-filter:blur(44px) saturate(2);-webkit-backdrop-filter:blur(44px) saturate(2);border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 18px 50px rgba(0,0,0,.38),0 0 60px -10px color-mix(in srgb,var(--ptint) 45%,transparent)}
@media(prefers-color-scheme:light){#side,#bar{border-color:rgba(255,255,255,.55)}}
@media(prefers-reduced-motion:reduce){#amb i{animation:none}}
/* ---------- extras: glow, tools, lyrics, fx panel ---------- */

  opacity:var(--o,1);filter:blur(var(--b,0px)) drop-shadow(0 0 var(--g,0px) var(--lcg,rgba(255,255,255,.4)));
  transition:color .45s,transform .55s cubic-bezier(.2,.9,.2,1),filter .55s,opacity .55s}
.ll.cur{color:var(--lc,#fff);transform:scale(1.05);--g:14px}
.lyrscroll.free .ll{filter:blur(0) drop-shadow(0 0 var(--g,0px) var(--lcg,rgba(255,255,255,.4)))!important;opacity:.8!important}
.lyrscroll.free .ll.cur,.ll:hover{opacity:1!important}
.ll:hover:not(.cur){color:rgba(255,255,255,.7);filter:blur(0) drop-shadow(0 0 0 transparent)!important}
.lyrscroll.kar .ll.cur .w{color:transparent;-webkit-background-clip:text;background-clip:text;
  background-image:linear-gradient(90deg,var(--lc,#fff) 0,var(--lc,#fff) calc(var(--p,0)*110% - 10%),rgba(255,255,255,.42) calc(var(--p,0)*110%),rgba(255,255,255,.42) 100%)}
#lkar{position:absolute;right:136px;bottom:-33px;z-index:3;font:800 11px/1 inherit;letter-spacing:.02em;padding:6px 10px;border-radius:99px;background:rgba(255,255,255,.14);color:#fff;border:0;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .3s,background .2s}

#lcol{position:absolute;right:222px;bottom:-33px;z-index:3;width:24px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:var(--lc,#fff);box-shadow:0 0 12px var(--lcg,transparent);cursor:pointer;opacity:0;pointer-events:none;transition:opacity .3s,transform .2s}

#lcol[data-m="2"]{border-style:dashed}#lcol[data-m="1"]{border-style:double;border-width:4px}

.lyrscroll{-webkit-transform:translateZ(0);isolation:isolate}
.ll{-webkit-backface-visibility:hidden;backface-visibility:hidden}
.lplain .ll{font-size:19px;font-weight:600;cursor:default;filter:none;color:rgba(255,255,255,.82);padding:4px 12px}
.lmsg{color:rgba(255,255,255,.6);font-size:17px;font-weight:600;padding:20px 12px}
#fx{position:fixed;right:18px;bottom:92px;z-index:80;width:min(440px,calc(100vw - 36px));max-height:calc(100vh - 176px);overflow:auto;padding:18px 18px 14px;border-radius:22px;background:var(--glass);backdrop-filter:blur(40px) saturate(1.6);-webkit-backdrop-filter:blur(40px) saturate(1.6);border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.5);color:var(--text);opacity:0;transform:translateY(14px) scale(.97);pointer-events:none;transition:opacity .25s,transform .35s cubic-bezier(.2,.9,.2,1);scrollbar-width:thin}

.keys{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12.5px;color:var(--muted)}

/* toast + drop */

.card.newpl .cc{display:grid;place-items:center;box-shadow:none;border:2px dashed var(--line);background:var(--hover);color:var(--muted);transition:border-color .2s,color .2s,background .2s}
.card.newpl:hover .cc{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);box-shadow:none}
.card.newpl .cc svg{width:44px;height:44px}
.card .plc{width:100%;height:100%;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.card:hover .cc .plc{transform:scale(1.06)}
.tilt .glow.plc::after{display:none}
.pled{width:min(460px,100%)}
.plcvbig{width:132px;height:132px;border-radius:18px;overflow:hidden;flex:none;box-shadow:0 12px 30px rgba(0,0,0,.4)}
.plcvbig .cover{width:100%;height:100%}
.mcard textarea{font:inherit;font-size:15px;color:var(--text);background:var(--hover);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none;resize:vertical;min-height:72px;max-height:180px}
.mcard textarea:focus{border-color:var(--accent)}
@media(max-width:700px){
  #nav .nav[data-view=playlists]{display:none}
  #plNav .nav .plthumb{display:none}
  .plhero{flex-direction:column;align-items:center;text-align:center;padding:22px 18px;gap:18px;border-radius:22px}
  .plcvw{width:min(62vw,250px);height:min(62vw,250px)}
  .plinfo{align-items:center}.plinfo h1{font-size:30px}.plmeta,.plinfo .dbtns{justify-content:center}
}

/* ===== анимированная обложка (видео-петля) ===== */
.cvloop{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit;opacity:0;transition:opacity .6s;pointer-events:none;background:#000}
.cvloop.on{opacity:1}
.dhead .cover{overflow:hidden}

/* ---------- каталог из интернета ---------- */
.chead{margin-bottom:16px}
.chead h1{margin:0;font-size:32px;letter-spacing:-.03em;font-weight:800}
.cchips{position:relative;margin:0 -6px 22px;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 12px,#000 calc(100% - 34px),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 12px,#000 calc(100% - 34px),transparent)}
.cchips-in{display:flex;gap:8px;overflow-x:auto;padding:4px 36px 8px 14px;scrollbar-width:none}
.cchips-in::-webkit-scrollbar{display:none}
.cchip{flex:none;display:inline-flex;align-items:center;gap:8px;padding:8px 15px 8px 12px;font-size:13.5px;white-space:nowrap;border:1px solid var(--line);background:color-mix(in srgb,var(--hover) 70%,transparent)}
.cchip::before{content:"";width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,hsl(var(--h) 90% 68%),hsl(calc(var(--h) + 40) 85% 52%));box-shadow:0 0 10px hsl(var(--h) 90% 60% / .65)}
.cchip.on{border-color:transparent;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 40%,transparent)}
.cchip.on::before{background:#fff;box-shadow:none}

.chero{position:relative;display:flex;align-items:center;gap:32px;padding:28px 32px;border-radius:26px;overflow:hidden;isolation:isolate;margin-bottom:32px;min-height:256px;color:#fff;border:1px solid var(--line);box-shadow:0 24px 60px rgba(0,0,0,.35);animation:fadeUp .6s cubic-bezier(.2,.8,.2,1) both}
.chero .hbg{position:absolute;inset:-50px;z-index:-2;width:auto;height:auto;filter:blur(46px) saturate(1.9) brightness(.82);transform:scale(1.15)}
.chero .hshade{position:absolute;inset:0;z-index:-1;background:linear-gradient(100deg,rgba(8,8,12,.58),rgba(8,8,12,.16) 62%,rgba(8,8,12,.34))}
.hcover{position:relative;flex:none;width:204px;height:204px;border-radius:18px;overflow:hidden;box-shadow:0 22px 50px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.14);cursor:pointer;transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.hcover:hover{transform:scale(1.04) rotate(-1deg)}
.hcover .cover{width:100%;height:100%}
.hplay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.38);opacity:0;transition:opacity .2s;color:#fff}
.hcover:hover .hplay{opacity:1}
.hplay svg{width:44px;height:44px}
.hinfo{min-width:0;flex:1;display:flex;flex-direction:column;gap:6px}
.heyebrow{display:inline-flex;align-self:flex-start;align-items:center;gap:7px;padding:5px 13px 5px 10px;border-radius:999px;background:rgba(255,255,255,.17);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.heyebrow svg{width:14px;height:14px}
.htitle{margin:8px 0 0;font-size:clamp(26px,3.6vw,46px);line-height:1.05;letter-spacing:-.035em;font-weight:800;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 2px 22px rgba(0,0,0,.35)}
.hartist{font-size:18px;font-weight:600;opacity:.93;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hmeta{opacity:.7;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtns{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.chero .pill{background:rgba(255,255,255,.18);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:#fff}
.chero .pill:hover{background:rgba(255,255,255,.3)}
.chero .pill.accent{background:#fff;color:#111;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.hcount{flex:none;align-self:flex-end;text-align:right;line-height:1;opacity:.9}
.hcount b{display:block;font-size:54px;font-weight:800;letter-spacing:-.04em}
.hcount span{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.75}

.csec{margin-bottom:30px;animation:fadeUp .6s .08s cubic-bezier(.2,.8,.2,1) both}
.csec h2,.ctool h2{margin:0;font-size:21px;letter-spacing:-.02em;font-weight:800}
.cartists{display:flex;gap:20px;overflow-x:auto;padding:10px 6px 12px;margin:0 -6px;scrollbar-width:none}
.cartists::-webkit-scrollbar{display:none}
.cart{flex:none;width:98px;display:flex;flex-direction:column;align-items:center;gap:10px;transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.cart:hover{transform:translateY(-4px)}
.cart:active{transform:scale(.95)}
.cav{width:98px;height:98px;border-radius:50%;overflow:hidden;box-shadow:0 10px 26px rgba(0,0,0,.4),0 0 0 0 var(--accent);transition:box-shadow .25s}
.cart:hover .cav{box-shadow:0 14px 32px rgba(0,0,0,.5),0 0 0 3px var(--accent)}
.cav .cover{width:100%;height:100%}
.cart span{font-size:13px;font-weight:600;max-width:100%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.ctool{display:flex;align-items:flex-end;gap:12px;margin:6px 0 18px}
.ctool .grow{flex:1}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--hover);gap:2px}
.seg button{width:38px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--muted);transition:background .2s,color .2s}
.seg button svg{width:17px;height:17px}
.seg button.on{background:var(--hover2);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.2)}

.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:28px 22px}
.ccard .cc{border-radius:16px}
.ccard.cur .cc{box-shadow:0 0 0 2.5px var(--accent),0 18px 40px rgba(0,0,0,.45)}
.ccard.cur .t{color:var(--accent)}
.crank{position:absolute;left:10px;top:10px;z-index:2;min-width:26px;height:26px;padding:0 8px;border-radius:999px;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);font-variant-numeric:tabular-nums}
.cdur{position:absolute;right:10px;bottom:10px;z-index:2;padding:3px 8px;border-radius:8px;font-size:11.5px;font-weight:700;color:#fff;background:rgba(0,0,0,.5);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font-variant-numeric:tabular-nums}
.ceq{display:none;position:absolute;left:10px;bottom:10px;z-index:2;width:34px;height:34px;padding:9px;border-radius:50%;background:rgba(0,0,0,.5);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);align-items:flex-end;justify-content:center;gap:2px}
.ceq i{width:2.5px}
.ccard.cur .ceq{display:flex}
.ccard.cur:hover .ceq{display:none}
.ccard.cur:not(:hover) .cplay{display:none}
.cacts{position:absolute;right:8px;top:8px;z-index:3;display:flex;gap:6px}
.cact{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(0,0,0,.5);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);transition:transform .2s cubic-bezier(.3,1.6,.5,1),background .2s,opacity .2s}
.cact svg{width:15px;height:15px}
.cact:hover{transform:scale(1.12);background:rgba(0,0,0,.72)}
.cact.on{background:var(--accent)}
.cact:disabled{opacity:.6;pointer-events:none}
.cadd{opacity:0}.ccard:hover .cadd{opacity:1}
@media(hover:none){.cadd{opacity:1}}

.sk-b{background:linear-gradient(100deg,var(--hover) 30%,var(--hover2) 50%,var(--hover) 70%);background-size:220% 100%;animation:shim 1.4s linear infinite}
@keyframes shim{from{background-position:130% 0}to{background-position:-90% 0}}
.chero.sk{min-height:256px;padding:0;border:0;box-shadow:none;border-radius:26px}
.skcard .skc{aspect-ratio:1;border-radius:16px}
.skcard .skl{height:12px;margin-top:11px;width:80%;border-radius:6px}
.skcard .skl.s{width:50%;height:10px;margin-top:8px}
.cmsg{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:64px 20px;animation:fadeUp .5s both}
.cmsg .big{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);margin-bottom:6px}
.cmsg .big svg{width:38px;height:38px}
.cmsg h2{margin:0;font-size:22px;letter-spacing:-.02em}
.cmsg p{margin:0 0 8px;color:var(--muted);max-width:380px}
.cnote{margin:36px 0 10px;text-align:center;color:var(--muted);font-size:12px}
.still .card,.still .chero,.still .csec,.still .cmsg{animation:none}
@media(max-width:700px){
  .chead h1{font-size:28px}
  .chero{flex-direction:column;align-items:flex-start;padding:20px;gap:18px;border-radius:22px;min-height:0}
  .hcover{width:min(42vw,156px);height:auto;aspect-ratio:1}
  .htitle{font-size:28px}.hcount{display:none}
  .cgrid{grid-template-columns:repeat(2,1fr);gap:22px 14px}
}
#full.pure .fcw{margin:0}
#full.pure .fmq{margin-top:20px}
@media (max-width:700px) and (orientation:portrait){
  #full.pure .fwrap{padding:calc(env(safe-area-inset-top,0px) + 60px) 16px calc(env(safe-area-inset-bottom,0px) + 40px)}
  #full.pure .fcw{width:min(90vw,52vh)}
  #full.pure .fdock{padding:90px 20px calc(env(safe-area-inset-bottom,0px) + 22px);gap:6px}
  #full.pure .f.info{max-width:420px;margin-bottom:6px}
  #full.pure .f .seek{max-width:420px;margin-bottom:8px}
  #full.pure #viz{height:34%}
}
@media (orientation:landscape) and (max-height:500px){
  #full.pure .fwrap{padding:12px 20px}
  #full.pure .fcw{width:min(66vh,50vw)}
  #full.pure .fdock{padding:70px 24px 14px;gap:4px}
  #full.pure .f.info{margin:0}
  #full.pure .f .seek{margin:0}
  #full.pure.hov .fcw{transform:translateY(-34px) scale(.68)}
}
@media (orientation:landscape) and (max-height:500px){
  #full .xrow{display:none}
  #full.circ:not(.lyr) .fcw{width:100%}
  #full.circ:not(.lyr) .f.info{margin-top:0}
}
/* на телефоне фон-подсветка не дрейфует: экономим батарею */
@media(max-width:700px){#amb i{animation:none}}

/* ---------- раздача по Wi‑Fi ---------- */
.mcard.sy{width:min(460px,100%);max-height:90vh;overflow:auto;gap:18px;padding:22px;border-radius:26px;scrollbar-width:none}
.mcard.sy::-webkit-scrollbar{display:none}
.sy-head{display:flex;align-items:center;gap:14px}
.sy-head h3{margin:0;font-size:20px;letter-spacing:-.02em;font-weight:800}
.sy-head p{margin:3px 0 0;color:var(--muted);font-size:13px}
.sy-badge{position:relative;flex:none;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,#ff6a82,var(--accent) 60%,#c9163a);box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 45%,transparent);transition:background .5s,box-shadow .5s}
.sy-badge svg{width:26px;height:26px;position:relative;z-index:1}
.sy-badge i{position:absolute;inset:0;border-radius:inherit;border:2px solid var(--accent);opacity:0;animation:syring 2.4s ease-out infinite}
.sy-badge i:nth-of-type(2){animation-delay:1.2s}
.sy-badge.ok{background:linear-gradient(145deg,#5ee59a,#2fcb73 60%,#1ea85a);box-shadow:0 8px 22px rgba(47,203,115,.45)}
.sy-badge.ok i{border-color:#32d583}
@keyframes syring{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.9);opacity:0}}
.sy-steps{display:flex;align-items:center;gap:8px}
.sy-st{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--muted);transition:color .3s}
.sy-st b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--hover2);color:var(--muted);transition:background .3s,color .3s,box-shadow .3s}
.sy-st b svg{width:13px;height:13px;stroke-width:3}
.sy-st.on,.sy-st.done{color:var(--text)}
.sy-st.on b{background:var(--accent);color:#fff;box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent)}
.sy-st.done b{background:#32d583;color:#fff}
.sy-ln{flex:1;height:2px;border-radius:2px;background:var(--hover2);min-width:10px;transition:background .3s}
.sy-ln.done{background:#32d583}
.sy-body{display:flex;flex-direction:column;gap:12px}
.sy-card{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:18px;border:1px solid var(--line);background:color-mix(in srgb,var(--hover) 70%,transparent);animation:fadeUp .4s cubic-bezier(.2,.8,.2,1) both}
.sy-ch{display:flex;align-items:center;gap:10px}
.sy-ch b{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;font-size:12px;transition:background .3s}
.sy-ch b svg{width:13px;height:13px;stroke-width:3}
.sy-ch h4{margin:0;font-size:15.5px;font-weight:700}
.sy-card.done .sy-ch b{background:#32d583}
.sy-txt{margin:0;font-size:13.5px;line-height:1.45;color:var(--muted)}
.sy-txt.sy-c{text-align:center;font-size:12.5px}
.sy-code{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--hover2);font:12px ui-monospace,Menlo,monospace}
.sy-code span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.85}
.sy-code em{font:700 11px -apple-system,sans-serif;padding:2px 8px;border-radius:99px;background:var(--hover);color:var(--muted)}
.sy-link{align-self:flex-start;font-size:12.5px;font-weight:600;color:var(--accent)}
.mcard .synccode.hid{position:absolute!important;left:-9999px;opacity:0;pointer-events:none;height:1px!important;min-height:0!important;padding:0;border:0}
.sy-btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:46px;padding:0 18px;border-radius:14px;font-weight:700;font-size:15px;background:var(--hover2);transition:background .2s,transform .15s,filter .2s}
.sy-btn svg{width:18px;height:18px}
.sy-btn:hover{filter:brightness(1.12)}.sy-btn:active{transform:scale(.97)}
.sy-btn:disabled{opacity:.5;pointer-events:none}
.sy-btn.pri{background:var(--accent);color:#fff;box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 35%,transparent)}
.sy-btn.okk{background:rgba(50,213,131,.18);color:#32d583;box-shadow:none}
.sy-btn.ghost{background:transparent;color:var(--muted);min-height:40px}
.sy-foot{display:flex;flex-direction:column;gap:4px}
.sy-status{display:flex;align-items:flex-start;gap:9px;font-size:13px;line-height:1.4;color:var(--muted)}
.sy-dot{flex:none;width:8px;height:8px;border-radius:50%;margin-top:5px;background:var(--muted)}
.sy-dot.busy{background:#ffb020;animation:sypulse 1.2s infinite}
.sy-dot.ok{background:#32d583}.sy-dot.err{background:#ff5c6c}
@keyframes sypulse{50%{opacity:.35}}
.sy-wait{display:flex;align-items:center;gap:12px;padding:6px 2px;color:var(--muted);font-size:13.5px}
.sy-spin{flex:none;width:20px;height:20px;border-radius:50%;border:2.5px solid var(--hover2);border-top-color:var(--accent);animation:syspin .8s linear infinite}
@keyframes syspin{to{transform:rotate(360deg)}}
.sy-dev{flex-direction:row;align-items:center;gap:14px}
.sy-devic{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:rgba(50,213,131,.16);color:#32d583}
.sy-devic svg{width:24px;height:24px}
.sy-dev b{display:block;font-size:16px}.sy-dev span{color:var(--muted);font-size:13px}
.sy-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sy-tile{padding:12px 8px;border-radius:14px;background:var(--hover);text-align:center;min-width:0}
.sy-tile b{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.sy-tile span{font-size:11.5px;color:var(--muted)}
.sy-tile.hl b{color:var(--accent)}
.sy-now{display:flex;align-items:center;gap:12px}
.sy-now .cover{width:48px;height:48px;border-radius:10px;flex:none}
.sy-now .tt{min-width:0;flex:1}
.sy-now .tt b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14.5px}
.sy-now .tt span{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sy-card .syncbar{height:8px;border-radius:99px}
.sy-card .syncbar i{border-radius:inherit;background:linear-gradient(90deg,var(--accent),#ff8a6b);transition:width .25s}
.sy-meta{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.sy-done{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:18px 8px}
.sy-done .ck{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:rgba(50,213,131,.16);color:#32d583;margin-bottom:6px;animation:sypop .5s cubic-bezier(.3,1.6,.5,1) both}
.sy-done .ck svg{width:38px;height:38px;stroke-width:2.6}
.sy-done h4{margin:0;font-size:20px;font-weight:800}.sy-done p{margin:0;color:var(--muted);font-size:14px;max-width:320px}
@keyframes sypop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
@keyframes sysheet{from{transform:translateY(46px);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.sy-badge i,.sy-spin,.sy-dot{animation:none}}
@media(max-width:700px){
  .modal:has(.mcard.sy){align-items:flex-end;padding:10px 10px calc(env(safe-area-inset-bottom,0px) + 10px)}
  .mcard.sy{width:100%;max-height:92vh;animation:sysheet .38s cubic-bezier(.2,.9,.3,1) both}
  .mcard .synccode{font-size:16px}
}
/* ===== аккаунт ===== */
.acc{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--hover);text-align:left;min-width:0;transition:background .2s,transform .15s}
.acc:hover{background:var(--hover2)}.acc:active{transform:scale(.97)}
.av{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;background:linear-gradient(145deg,hsl(var(--h,0) 78% 62%),hsl(calc(var(--h,0) + 32) 70% 44%));box-shadow:0 3px 10px rgba(0,0,0,.25)}
.av.guest{background:var(--hover2);color:var(--muted);box-shadow:none}
.av svg{width:55%;height:55%}
.av.big{width:64px;height:64px;font-size:28px}
.acc .an{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.acc .an b,.mitem .two b{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc .an small,.mitem .two small{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mcard.am{width:min(420px,100%);overflow:auto}
.atop{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.atop h3{margin:6px 0 0}
.atop .psub{margin:0;font-size:13px}
.astat{font-size:12px;color:var(--muted)}
.aform{display:flex;flex-direction:column;gap:12px}
.atabs{display:flex;padding:3px;border-radius:12px;background:var(--hover);gap:2px}
.atabs button{flex:1;padding:8px;border-radius:9px;font-weight:600;color:var(--muted);transition:background .2s,color .2s}
.atabs button.on{background:var(--hover2);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.2)}
.aerr{font-size:13px;color:#ff5c6c;line-height:1.35}
.aerr:empty{display:none}
.alinks{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.alink{font-size:13px;color:var(--accent);font-weight:600}.alink:hover{text-decoration:underline}
.afoot{font-size:12px;text-align:center}
.achk{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text);cursor:pointer}
.mcard input[type=checkbox]{width:18px;height:18px;padding:0;accent-color:var(--accent);flex:none}
.pill.full{width:100%;justify-content:center;padding:12px 16px}
.pill:disabled{opacity:.6;pointer-events:none}
.mitem.danger,.mitem.danger svg{color:#ff5c6c}
.mitem .av{width:32px;height:32px;font-size:14px}
.mitem .two{display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.25}
@media(max-width:900px){.acc{justify-content:center;padding:6px;align-self:center}.acc .an{display:none}}
@media(max-width:700px){.acc{display:none}}
.accm{display:none}
@media(max-width:700px){.atop .av.guest{display:none}}
@media(max-width:700px){
  .accm{display:block;flex:none;width:40px;height:40px;border-radius:50%;padding:0;transition:transform .15s}
  .accm:active{transform:scale(.93)}
  .accm .av{width:40px;height:40px;font-size:17px}
  .accm .av.guest{background:var(--hover)}
}
</style>

  const scored = [];

$('#fSleep').onclick = () => { const m = SLEEP_CYCLE[(SLEEP_CYCLE.indexOf(sleepMode) + 1) % SLEEP_CYCLE.length]; setSleep(m); if (!m) toast('Таймер сна: выкл', 1400); };
const _updFxBtn = updFxBtn; updFxBtn = () => { _updFxBtn(); $('#fSleep').classList.toggle('on', !!sleepMode); };
async function shareTrack() {
  const t = byId(curId); if (!t) { toast('Сейчас ничего не играет', 1400); return; }
  const text = (t.artist ? t.artist + ' — ' : '') + t.title;
  try {
    if (!t.stream && navigator.canShare) {
      const b = await tx(['blobs'], 'readonly', x => x.objectStore('blobs').get(t.id));
      const f = b && new File([b], t.name || (text + '.mp3'), { type: b.type || 'audio/mpeg' });
      if (f && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: t.title, text }); return; }
    }
    if (navigator.share) { await navigator.share({ title: t.title, text }); return; }
    await navigator.clipboard.writeText(text); toast('Название скопировано', 1600);
  } catch (e) { if (e && e.name !== 'AbortError') { try { await navigator.clipboard.writeText(text); toast('Название скопировано', 1600); } catch (e2) {} } }
}
$('#fShare').onclick = shareTrack;
function updExtra() {
  const t = byId(curId), b = $('#fSave'), st = !!(t && t.stream); b.classList.toggle('hid', !st);
  if (st) { const have = tracks.some(x => x.aud === t.aud); b.querySelector('use').setAttribute('href', have ? '#i-check' : '#i-dl'); b.title = have ? 'Уже сохранён на устройстве' : 'Сохранить на устройство (офлайн)'; b.classList.toggle('on', have); }
}
$('#fSave').onclick = () => { const t = byId(curId); if (t && t.stream) audDownload(t).then(updExtra); };


// ===== свайпы по строкам: вправо — «играть следующей», влево — любимое (только телефон) =====
let swT = 0;
function swipeRow(r, t) {

  const TH = 88;
  r.addEventListener('pointerdown', e => { if (e.pointerType === 'mouse' || innerWidth > 700 || e.target.closest('button')) return; sx = e.clientX; sy = e.clientY; pid = e.pointerId; lock = null; went = false; });
  r.addEventListener('pointermove', e => {
    if (pid !== e.pointerId) return; const dx = e.clientX - sx, dy = e.clientY - sy;
    if (!lock) { if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return; lock = Math.abs(dx) > Math.abs(dy) * 1.4 ? 'x' : 'y'; if (lock === 'y') { pid = null; return; }
      swa = h('div', 'swa'); const l = h('div', 'sl'), rr = h('div', 'sr'); l.append(icon('queue', true), h('span', null, 'Следующей')); rr.append(h('span', null, t.fav ? 'Убрать' : 'Любимое'), icon('heart', true)); swa.append(l, rr); r.append(swa);
      kids = [...r.children].filter(c => c !== swa); r.style.overflow = 'hidden'; kids.forEach(c => { c.style.transition = 'none'; }); }
    x = Math.max(-170, Math.min(170, dx * .85)); const go = Math.abs(x) >= TH;
    swa.dataset.dir = x > 0 ? 'r' : 'l'; swa.style.width = Math.abs(x) + 'px'; swa.classList.toggle('go', go);
    if (go && !went && navigator.vibrate) navigator.vibrate(8); went = go;
    kids.forEach(c => { c.style.transform = `translateX(${x}px)`; });
  });
  const end = e => {
    if (pid !== e.pointerId) return; pid = null; if (lock !== 'x' || !swa) return;
    const commit = e.type === 'pointerup' && Math.abs(x) >= TH, dir = x > 0, s = swa; swT = Date.now();
    kids.forEach(c => { c.style.transition = 'transform .5s cubic-bezier(.3,1.4,.5,1)'; c.style.transform = ''; });
    s.style.transition = 'width .5s cubic-bezier(.3,1.4,.5,1)'; s.style.width = '0px';
    setTimeout(() => { s.remove(); r.style.overflow = ''; kids.forEach(c => { c.style.transition = ''; }); }, 520);
    swa = null; lock = null;
    if (!commit) return;
    if (dir) queueAdd([t], true);
    else toggleFav(t).then(() => { if (!t.stream) toast(t.fav ? 'Добавлено в любимое' : 'Убрано из любимого', 1300); });
  };
  r.addEventListener('pointerup', end); r.addEventListener('pointercancel', end);
}

// ===== статистика прослушивания =====
const statDays = (() => { try { return JSON.parse(localStorage.getItem('mp2days') || '{}'); } catch (e) { return {}; } })();
const saveDays = () => { try { localStorage.setItem('mp2days', JSON.stringify(statDays)); } catch (e) {} };
const dayKey = (d = new Date()) => d.toLocaleDateString('sv');
let lastCT = null, secDirty = 0, secTrack = null, metaDirty = false;
function tick(e) {
  const a = e.target; if (a !== audio || a.paused || a.src === WAV) { lastCT = null; return; }
  const c = a.currentTime, d = lastCT == null ? 0 : c - lastCT; lastCT = c; if (d <= 0 || d > 1.5) return;
  const t = byId(curId);
  if (secTrack && secTrack !== t && tracks.includes(secTrack)) saveMeta(secTrack).catch(() => {});
  secTrack = t && !t.stream ? t : null; if (secTrack) secTrack.secs = (secTrack.secs || 0) + d;
  const k = dayKey(); statDays[k] = (statDays[k] || 0) + d; secDirty += d; metaDirty = true;
}
function flushStats(heavy) {
  if (secDirty) { secDirty = 0; saveDays(); }
  if (heavy !== false && metaDirty) { metaDirty = false; if (secTrack && tracks.includes(secTrack)) saveMeta(secTrack).catch(() => {}); }
}
[audA, audB].forEach(a => { a.addEventListener('timeupdate', tick); a.addEventListener('seeking', () => { lastCT = null; }); a.addEventListener('loadstart', () => { lastCT = null; }); a.addEventListener('pause', flushStats); });
setInterval(() => flushStats(false), 20000);   // по таймеру только лёгкая запись; тяжёлая (с обложкой) — при паузе, смене трека и выходе addEventListener('pagehide', flushStats);

function renderStats(c, main) {
  const ps = tracks.filter(t => t.plays || t.secs), eff = t => t.secs || (t.plays || 0) * (t.duration || 0);
  const totS = Object.values(statDays).reduce((a, b) => a + b, 0) || ps.reduce((a, t) => a + eff(t), 0);
  c.append(pageHead('Итоги', 'Ваша музыка за всё время'));
  if (!ps.length) { c.append(h('div', 'psub', 'Послушайте музыку: здесь появятся любимые исполнители, песни и время прослушивания')); return; }
  let streak = 0; const d0 = new Date(); if (!(statDays[dayKey(d0)] > 30)) d0.setDate(d0.getDate() - 1);
  for (const d = d0; statDays[dayKey(d)] > 30; d.setDate(d.getDate() - 1)) streak++;
  const card = (v, l, k) => { const e = h('div', 'sc'); e.style.setProperty('--k', k); e.append(h('b', null, v), h('span', null, l)); return e; };
  const sg = h('div', 'sg'); sg.append(card(fmtLong(totS), 'Время музыки', 0), card(String(ps.reduce((a, t) => a + (t.plays || 0), 0)), 'Прослушиваний', 1), card(String(ps.length), 'Разных песен', 2), card(String(streak), 'Дней подряд', 3)); c.append(sg);
  // неделя
  c.append(h('div', 'sh', 'За неделю'));
  const days = [...Array(7)].map((_, i) => { const d = new Date(); d.setDate(d.getDate() - 6 + i); return { d, m: (statDays[dayKey(d)] || 0) / 60 }; }), mx = Math.max(1, ...days.map(x => x.m));
  const wk = h('div', 'wk');
  days.forEach((x, i) => { const col = h('div', i === 6 ? 'now' : ''), cw = h('div', 'col'), b = h('i'); b.style.setProperty('--k', i); b.dataset.w = Math.max(2, x.m / mx * 100) + '%'; b.title = Math.round(x.m) + ' мин'; cw.append(b); col.append(cw, h('small', null, ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'][x.d.getDay()])); wk.append(col); });
  c.append(wk);
  const rk = (i, t, title, sub, pct, fn) => { const r = h('div', 'rk'); r.style.setProperty('--k', i); const bd = h('div'), bar = h('div', 'rb'), bi = h('i'); bi.dataset.w = pct + '%'; bi.style.setProperty('--k', i); bar.append(bi);
    bd.append(h('div', 't', title), h('div', 'sub', sub), bar); r.append(h('em', null, String(i + 1)), coverEl(t.coverUrl, t.album || t.title), bd); r.onclick = fn; return r; };
  // исполнители
  const ar = new Map(); ps.forEach(t => { const n = t.artist || 'Неизвестный исполнитель', a = ar.get(n) || { n, w: 0, p: 0, t }; a.w += eff(t); a.p += t.plays || 0; ar.set(n, a); });

  c.append(h('div', 'sh', 'Исполнители')); ta.forEach((a, i) => c.append(rk(i, a.t, a.n, fmtLong(a.w) + ' · ' + pl(a.p, ['прослушивание', 'прослушивания', 'прослушиваний']), a.w / ta[0].w * 100, () => setView('artists', { type: 'artist', key: a.n }))));
  // песни
  const tt = ps.slice().sort((a, b) => (b.plays || 0) - (a.plays || 0) || eff(b) - eff(a)).slice(0, 5), ids = tt.map(t => t.id);
  c.append(h('div', 'sh', 'Песни')); tt.forEach((t, i) => c.append(rk(i, t, t.title, (t.artist ? t.artist + ' · ' : '') + pl(t.plays || 0, ['раз', 'раза', 'раз']), (t.plays || 1) / (tt[0].plays || 1) * 100, () => play(t.id, ids))));
  requestAnimationFrame(() => requestAnimationFrame(() => c.querySelectorAll('[data-w]').forEach(e => { e.style[e.closest('.wk') ? 'height' : 'width'] = e.dataset.w; })));
  main.scrollTop = 0;
}

// ===== перетаскивание в плейлисте =====
function sortable(box, onDone) {   // на телефоне — долгое касание, мышью — обычное перетаскивание
  let st = null, lastDrag = 0;
  const main = $('#main');
  box.addEventListener('touchmove', e => { if (st && st.on) e.preventDefault(); }, { passive: false });
  box.addEventListener('click', e => { if (Date.now() - lastDrag < 400) { e.stopPropagation(); e.preventDefault(); } }, true);
  box.addEventListener('pointerdown', e => {
    const r = e.target.closest('.row'); if (!r || e.target.closest('button') || st) return;
    st = { r, pid: e.pointerId, sx: e.clientX, sy: e.clientY, y: e.clientY, on: false, touch: e.pointerType !== 'mouse', timer: 0 };
    if (st.touch) st.timer = setTimeout(() => arm(), 380);
  });
  function arm() {
    if (!st || st.on) return; const rs = [...box.querySelectorAll(':scope > .row')];
    Object.assign(st, { on: true, rs, i0: rs.indexOf(st.r), cur: rs.indexOf(st.r), step: rs.length > 1 ? rs[1].offsetTop - rs[0].offsetTop : st.r.offsetHeight, sc0: main.scrollTop, y0: st.y });
    try { st.r.setPointerCapture(st.pid); } catch (e) {} if (navigator.vibrate) navigator.vibrate(12);
    rs.forEach(x => { x.style.transition = x === st.r ? 'none' : `transform .28s ${EASE}`; }); st.r.classList.add('lift'); st.r.style.transform = 'scale(1.02)';
    (function loop() { if (!st || !st.on) return; const rc = main.getBoundingClientRect(), y = st.y; if (y < rc.top + 70) main.scrollTop -= 9; else if (y > rc.bottom - 110) main.scrollTop += 9; move(); requestAnimationFrame(loop); })();
  }
  function move() {
    if (!st || !st.on) return; const dy = st.y - st.y0 + (main.scrollTop - st.sc0), n = st.rs.length;
    st.r.style.transform = `translateY(${dy}px) scale(1.02)`;
    const to = Math.max(0, Math.min(n - 1, Math.round(st.i0 + dy / st.step))); if (to === st.cur) return; st.cur = to;
    st.rs.forEach((x, k) => { if (x !== st.r) x.style.transform = st.i0 < to && k > st.i0 && k <= to ? `translateY(${-st.step}px)` : st.i0 > to && k < st.i0 && k >= to ? `translateY(${st.step}px)` : ''; });
  }
  box.addEventListener('pointermove', e => {
    if (!st || e.pointerId !== st.pid) return; st.y = e.clientY;
    if (!st.on) { const mv = Math.hypot(e.clientX - st.sx, e.clientY - st.sy); if (st.touch) { if (mv > 10) { clearTimeout(st.timer); st = null; } } else if (mv > 6) arm(); }
    else move();
  });
  const end = e => {
    if (!st || e.pointerId !== st.pid) return; clearTimeout(st.timer); const s = st; st = null;
    if (!s.on) return; s.on = false; lastDrag = Date.now();
    if (e.type !== 'pointerup' || s.cur === s.i0) { s.rs.forEach(x => { x.style.transition = `transform .35s ${SPRING}`; x.style.transform = ''; }); s.r.classList.remove('lift'); return; }
    s.r.style.transition = `transform .3s ${EASE}`; s.r.style.transform = `translateY(${(s.cur - s.i0) * s.step}px)`; s.r.classList.remove('lift');
    setTimeout(() => onDone(s.i0, s.cur), 300);
  };
  box.addEventListener('pointerup', end); box.addEventListener('pointercancel', end);
}

// ===== продолжить с того же места =====
function saveResume() {
  if (typeof curId !== 'number' || !byId(curId) || audio.readyState < 1 || audio.src === WAV) return;
  try { localStorage.setItem('mp2resume', JSON.stringify({ id: curId, pos: audio.currentTime || 0, queue: queue.filter(x => typeof x === 'number').slice(0, 3000), up: upNext.filter(x => typeof x === 'number') })); } catch (e) {}
}
[audA, audB].forEach(a => { a.addEventListener('pause', () => setTimeout(saveResume, 600)); a.addEventListener('play', () => setTimeout(saveResume, 600)); });
setInterval(() => { if (!audio.paused) saveResume(); }, 5000);
addEventListener('pagehide', saveResume); document.addEventListener('visibilitychange', () => { if (document.hidden) saveResume(); });
async function resumeLast() {
  let r = null; try { r = JSON.parse(localStorage.getItem('mp2resume') || 'null'); } catch (e) {}
  const t = r && byId(r.id); if (!t) return;
  const blob = await tx(['blobs'], 'readonly', x => x.objectStore('blobs').get(r.id)); if (!blob) return;
  queue = (r.queue || []).filter(x => byId(x)); upNext = (r.up || []).filter(x => byId(x)); if (!queue.includes(r.id)) queue.push(r.id);
  lastQ = r.id; curId = r.id; specStart(r.id, blob);
  const u = URL.createObjectURL(blob); elUrl.set(audio, u); audio.src = u; audio.playbackRate = FX.speed;
  audio.addEventListener('loadedmetadata', () => { if (r.pos > 0 && r.pos < audio.duration - 2) audio.currentTime = r.pos; }, { once: true });
  updateNow(); markCurrent();
  setMediaMeta(t);
}

(async () => {
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  restore(); updateNow();
  try { db = await openDB(); await loadLibrary(); await cleanLibrary(); await applyPend(); setLfs(lfs); await resumeLast(); backfillGenres(); }
  catch (e) { $('#content').innerHTML = ''; toast('Не удалось открыть хранилище браузера', 6000); }
})();
})();
